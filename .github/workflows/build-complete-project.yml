name: Build Complete Project Package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab python-docx python-pptx openpyxl
      - run: python scripts/build_project_package.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports presentation data docs dist
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build complete project deliverables"; git push; fi
